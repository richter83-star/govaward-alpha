[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govaward-alpha"
version = "0.1.0"
description = "Local-first U.S. government contract award alert engine for public-information market research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "yfinance>=0.2.40",
    "rapidfuzz>=3.9.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "PyYAML>=6.0.1",
    "tabulate>=0.9.0",
    "google-genai>=2.20.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
govaward = "govaward_alpha.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
